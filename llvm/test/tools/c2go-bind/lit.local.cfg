# Cross-repo nosplit pin for the out-of-tree c2go-bind tool.
#
# c2go-bind is a Go program that lives outside the llvm-project tree
# (default: /Users/dexter/Downloads/c2go/c2go-bind/c2go-bind; overridable
# via the C2GOBIND env var - same convention as the SQLite e2e gate at
# .build_status/sqlite_e2e_gate.sh / regen_verify*.sh). When the
# binary is not reachable from this build (most CI configurations),
# mark the whole directory unsupported so the LIT is skipped cleanly
# rather than failing with a noisy missing-tool error.
#
# When the binary IS reachable, expose its absolute path as the
# %c2gobind substitution so the LIT can invoke it directly.

import os
import shutil

c2gobind = os.environ.get("C2GOBIND") or shutil.which("c2go-bind")
if not c2gobind:
    fallback = "/Users/dexter/Downloads/c2go/c2go-bind/c2go-bind"
    if os.path.isfile(fallback) and os.access(fallback, os.X_OK):
        c2gobind = fallback

if not c2gobind or not os.path.isfile(c2gobind) or not os.access(c2gobind, os.X_OK):
    config.unsupported = True
else:
    config.substitutions.append(("%c2gobind", c2gobind))
